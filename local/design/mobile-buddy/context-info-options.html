			gap: 0;

			display: none;

		#buddy-context-options .buddy-preview-model {
			min-width: 72px;
		}

			padding-inline: 10px;
		}
		#buddy-context-options .buddy-preview-intro {
			font-size: 15px;
		}
		#buddy-context-options .buddy-preview-context {
			font-size: 14px;
		}

</style>
<script>
	(function () {
		const root = document.getElementById('buddy-context-options');
		const template = root.querySelector('#buddy-context-phone');
		const previewState = {
			keyboardVisible: true,
			usageAvailable: true,
			usagePercent: 11
		};
		const phones = [];

		function applySavedPreview(saved) {
			const values = saved?.modelContent;
			if (values?.preview !== 'Buddy context') return;
			if (typeof values.keyboardVisible === 'boolean') {
				previewState.keyboardVisible = values.keyboardVisible;
			}
			if (typeof values.usageAvailable === 'boolean') {
				previewState.usageAvailable = values.usageAvailable;
			}
			if (typeof values.usagePercent === 'number' && Number.isFinite(values.usagePercent)) {
				previewState.usagePercent = Math.max(1, Math.min(95, values.usagePercent));
			}
		}
		function savePreviewState() {
			if (!window.openai?.setWidgetState) return;
			window.openai
				.setWidgetState({
					modelContent: {
						preview: 'Buddy context',
						keyboardVisible: previewState.keyboardVisible,
						usageAvailable: previewState.usageAvailable,
						usagePercent: previewState.usagePercent
					},
					privateContent: null
				})
				.catch(function ignoreUnavailableState() {});
		}
		function handlePreviewChange() {
			renderPreview();
			savePreviewState();
		}
		function handleSavedPreview(event) {
			const saved = event.detail?.globals?.widgetState;
			if (!saved) return;
			applySavedPreview(saved);
			renderPreview();
		}
		applySavedPreview(window.openai?.widgetState);
		window.addEventListener('openai:set_globals', handleSavedPreview);

		function createPhone(containerId, layout, label) {
			const container = root.querySelector('#' + containerId);
			container.appendChild(template.content.cloneNode(true));
			const phone = container.querySelector('.buddy-preview-app');
			phone.dataset.layout = layout;
			phone.setAttribute('aria-label', label);
			phones.push(phone);
			const contextButton = phone.querySelector('.buddy-preview-context');
			const details = phone.querySelector('.buddy-preview-details');
			const dismissButton = phone.querySelector('.buddy-preview-dismiss');
			contextButton.setAttribute('aria-label', 'Open context window details');

			function closeDetails() {
				details.hidden = true;
				contextButton.setAttribute('aria-expanded', 'false');
				contextButton.focus({ preventScroll: true });
			}
			function toggleDetails() {
				details.hidden = !details.hidden;
				contextButton.setAttribute('aria-expanded', String(!details.hidden));
				if (!details.hidden) {
					dismissButton.focus({ preventScroll: true });
				}
			}
			function handleEscape(event) {
				if (event.key === 'Escape' && !details.hidden) {
					event.preventDefault();
					closeDetails();
				}
			}
			contextButton.addEventListener('click', toggleDetails);
			dismissButton.addEventListener('click', closeDetails);
			phone.addEventListener('keydown', handleEscape);
		}

		function compactTokens(value) {
			return (value / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
		}
		function renderPreview() {
			const percent = previewState.usagePercent;
			const usedTokens = Math.round((32000 * percent) / 100);
			const usedLabel = compactTokens(usedTokens);
			for (const phone of phones) {
				phone.dataset.keyboard = String(previewState.keyboardVisible);
				phone.dataset.available = String(previewState.usageAvailable);
				const contextLabel = phone.querySelector('.buddy-preview-context-label');
				if (previewState.usageAvailable) {
					contextLabel.textContent = 'Context ' + usedLabel + ' / 32K';
				} else {
					contextLabel.textContent = 'Context info';
				}
				phone.querySelector('.buddy-preview-percent').textContent = percent + '%';
				phone.querySelector('.buddy-preview-ring-value').style.strokeDasharray = percent + ' 100';
				const meter = phone.querySelector('.buddy-preview-meter');
				meter.setAttribute('aria-valuenow', String(percent));
				meter.firstElementChild.style.width = percent + '%';
				phone.querySelector('.buddy-preview-used').textContent = usedLabel + ' tokens';
				phone.querySelector('.buddy-preview-available').textContent =
					compactTokens(32000 - usedTokens) + ' tokens';
				meter.hidden = !previewState.usageAvailable;
				phone.querySelector('.buddy-preview-pending').hidden = previewState.usageAvailable;
				const detailRows = phone.querySelectorAll('.buddy-preview-detail-row');
				for (const row of detailRows) {
					row.hidden = !previewState.usageAvailable;
				}
			}
		}
		createPhone('buddy-floating-label', 'label', 'Buddy with a floating context label');
		createPhone('buddy-usage-ring', 'ring', 'Buddy with a floating context usage ring');
		createPhone(
			'buddy-composer-shortcut',
			'inline',
			'Buddy with context details inside the composer'
		);
		renderPreview();
		if (globalThis.lucide) {
			lucide.createIcons();
		}
		if (globalThis.Tweak) {
			const previewControls = new Tweak({
				container: root,
				onChange: handlePreviewChange
			});
			previewControls.addToggle(previewState, 'keyboardVisible', {
				label: 'Keyboard visible'
			});
			previewControls.addToggle(previewState, 'usageAvailable', {
				label: 'Usage available'
			});
			previewControls.addSlider(previewState, 'usagePercent', {
				label: 'Context used',
				min: 1,
				max: 95,
				step: 1,
				unit: '%'
			});
		}
	})();
</script>
