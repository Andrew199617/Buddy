<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Buddy</title>
		<style>
			:root {
				color-scheme: light dark;
				--text: #1d2520;
				--soft: #5d6a61;
				--edge: #dde6df;
				--field: #faf8f5;
				--page: #ffffff;
				--accent: #27634b;
				--error: #b42318;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--text: #ecefed;
					--soft: #a5b0a8;
					--edge: #333a35;
					--field: #222724;
					--page: #171a18;
					--accent: #3f8f6b;
					--error: #f97066;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 24px;
				background: var(--page);
				color: var(--text);
				font-family: 'Segoe UI', system-ui, sans-serif;
			}
			main {
				width: min(420px, 100%);
			}
			h1 {
				font-size: 24px;
				margin: 0 0 8px;
			}
			p {
				color: var(--soft);
				font-size: 14px;
				line-height: 1.55;
				margin: 0 0 20px;
			}
			label {
				display: block;
				font-size: 13px;
				font-weight: 600;
				margin-bottom: 6px;
			}
			input {
				width: 100%;
				font: inherit;
				font-size: 16px;
				padding: 11px 12px;
				border-radius: 10px;
				border: 1px solid var(--edge);
				background: var(--field);
				color: inherit;
			}
			input:focus-visible,
			button:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}
			button {
				margin-top: 16px;
				width: 100%;
				min-height: 44px;
				font: inherit;
				font-size: 15px;
				font-weight: 600;
				border: 0;
				border-radius: 10px;
				background: var(--accent);
				color: #fff;
				cursor: pointer;
			}
			button:disabled {
				opacity: 0.6;
				cursor: progress;
			}
			#address-error {
				color: var(--error);
				margin: 10px 0 0;
				min-height: 1.5em;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Your Buddy address</h1>
			<p>
				Enter the address you use to open Buddy in a browser. The app opens it here and can connect
				this computer to it.
			</p>
			<form id="address-form">
				<label for="address">Buddy address</label>
				<input
					id="address"
					type="text"
					inputmode="url"
					autocomplete="url"
					spellcheck="false"
					placeholder="https://buddy.example.com"
					required
					aria-describedby="address-error"
				/>
				<p id="address-error" role="alert"></p>
				<button id="continue" type="submit">Continue</button>
			</form>
		</main>
		<script src="../dist/src/setup-page.js"></script>
	</body>
</html>
