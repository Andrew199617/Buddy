# Buddy in Docker: the backend plus the production frontend server.
#
#   docker compose -f docker/buddy/compose.yaml up -d --build
#
# Settings come from docker/buddy/.env (copy example.env). Claude Code and
# Codex run on machines added in Admin Settings → Connections → Subscriptions,
# such as a TLS-enabled Runner at https://host.docker.internal:8765.
# Use the optional runner TLS overlay for application-scoped public CA trust;
# see companion/TLS_SETUP.md. Never mount the Runner private key here.
name: buddy

services:
  buddy:
    build:
      context: ../..
      target: base
    image: buddy:local
    command: ['python', '/app/local/serve.py', 'serve', '--host', '0.0.0.0', '--port', '8080']
    environment:
      DATA_DIR: /app/backend/data
      WEBUI_NAME: Buddy
      WEBUI_FAVICON_URL: /static/favicon.png
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in docker/buddy/.env}
      WEBUI_URL: ${BUDDY_PUBLIC_URL:-http://localhost:8082}
      MCP_OAUTH_ALLOWED_REDIRECT_HOSTS: ${BUDDY_ALLOWED_HOSTS:-}
      # Written by the `backup` service; Admin Settings > Backups reads it and queues manual runs there.
      BUDDY_BACKUP_STATUS_DB: /app/backend/backup-status/status.db
    volumes:
      - buddy-data:/app/backend/data
      - backup-status:/app/backend/backup-status
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${BUDDY_BACKEND_PORT:-8081}:8080'
    restart: unless-stopped

  web:
    build:
      context: ../..
      target: web
    image: buddy-web:local
    environment:
      # Host names the frontend server answers to, besides IPs and localhost.
      MCP_OAUTH_ALLOWED_REDIRECT_HOSTS: ${BUDDY_ALLOWED_HOSTS:-}
    depends_on:
      - buddy
    ports:
      - '${BUDDY_PORT:-8082}:8082'
    restart: unless-stopped

  # Nightly Perforce backup of this instance (backup/buddy_backup.py): one changelist with webui.db, data.tar.gz and
  # this .env, filetype binary+S7. Only the release instance opts in, with COMPOSE_PROFILES=backup in .env; see
  # AGENTS.md "Backups (release only)". Data and secrets are mounted read-only; missing files fail the start
  # instead of turning into empty directories.
  backup:
    build:
      context: ./backup
    image: buddy-backup:local
    profiles: [backup]
    environment:
      TZ: ${BUDDY_BACKUP_TZ:-America/Los_Angeles}
      BACKUP_TIME: ${BUDDY_BACKUP_TIME:-03:00}
      BACKUP_DEPOT_PATH: ${BUDDY_BACKUP_DEPOT_PATH:-//Backups/Buddy}
      BACKUP_P4CLIENT: ${BUDDY_BACKUP_P4CLIENT:-buddy-backup}
      BACKUP_P4PORT: ${BUDDY_BACKUP_P4PORT:-}
      BACKUP_P4USER: ${BUDDY_BACKUP_P4USER:-}
    volumes:
      - type: volume
        source: buddy-data
        target: /backup/data
        read_only: true
      - type: volume
        source: backup-status
        target: /status
      - type: bind
        source: ${BUDDY_ENV_FILE:-./.env}
        target: /backup/buddy.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BUDDY_P4_TICKETS:-${USERPROFILE}/p4tickets.txt}
        target: /p4host/p4tickets.txt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BUDDY_P4_TRUST:-${USERPROFILE}/p4trust.txt}
        target: /p4host/p4trust.txt
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

volumes:
  buddy-data:
  backup-status:
